name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: |
          mkdir -p build/reports/flutter-analyze
          flutter analyze 2>&1 | tee build/reports/flutter-analyze/analyze.log

      - name: Upload analysis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-report
          path: build/reports/flutter-analyze/
          if-no-files-found: warn
          retention-days: 3

  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: |
          mkdir -p build/reports/flutter-test
          flutter test --file-reporter json:build/reports/flutter-test/results.json 2>&1 | tee build/reports/flutter-test/test.log

      - name: Upload Flutter test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-report
          path: build/reports/flutter-test/
          if-no-files-found: warn
          retention-days: 3

  python-data-tests:
    name: Python Data Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python -m pip install pytest==7.4.0

      - name: Run store data validation tests
        run: |
          mkdir -p build/reports/python-data-tests
          python -m pytest tests/data \
            --junitxml=build/reports/python-data-tests/junit.xml \
            2>&1 | tee build/reports/python-data-tests/pytest.log

      - name: Upload Python data test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-data-test-report
          path: build/reports/python-data-tests/
          if-no-files-found: warn
          retention-days: 3

  android-debug-build:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          mkdir -p build/reports/android-debug-build
          flutter build apk --debug 2>&1 | tee build/reports/android-debug-build/build.log

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-build-report
          path: build/reports/android-debug-build/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: burger-map-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  android-integration-tests:
    name: Android Integration Tests
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android integration tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: mkdir -p build/reports/android-integration-test && bash -o pipefail -c 'flutter test integration_test/app_flow_test.dart -d emulator-5554 2>&1 | tee build/reports/android-integration-test/test.log'

      - name: Upload Android integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-test-report
          path: build/reports/android-integration-test/
          if-no-files-found: warn
          retention-days: 3
